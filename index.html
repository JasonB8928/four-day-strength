<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4-Day Strength">
<title>Four-Day Strength V3</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:light dark;
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --brand:#2563eb; --brand2:#1d4ed8; --ok:#15803d; --warn:#b45309; --bad:#dc2626;
  --chip:#f8fafc;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220; --card:#161d2b; --text:#f8fafc; --muted:#94a3b8; --line:#273349; --brand:#3b82f6; --chip:#1e293b;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.92);backdrop-filter:saturate(180%) blur(14px);
  color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;font-weight:700;letter-spacing:.2px;font-size:15px}
main{max-width:640px;margin:0 auto;padding:12px 14px}
h2{font-size:22px;margin:6px 2px 10px;letter-spacing:-.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -18px rgba(15,23,42,.35)}
.card.slim{padding:12px 14px}
.hero{background:linear-gradient(160deg,var(--brand),var(--brand2));border:0;color:#fff}
.hero .kicker,.hero .muted{color:rgba(255,255,255,.82)}
.kicker{font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.h1{font-size:30px;font-weight:800;letter-spacing:-.8px;margin:2px 0 8px}
.h2{font-size:20px;font-weight:750;letter-spacing:-.3px}
.muted{color:var(--muted)} .sm{font-size:13px} .metric{font-size:26px;font-weight:800;letter-spacing:-.5px}
.lifts{display:flex;flex-direction:column;gap:2px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid rgba(148,163,184,.22)}
.lrow:first-child{border-top:0}
.hero .lrow{border-color:rgba(255,255,255,.22)}
button{font:inherit;font-weight:650;border:0;border-radius:13px;padding:13px 14px;min-height:46px;
  background:var(--brand);color:#fff;cursor:pointer;transition:transform .06s ease,opacity .15s}
button:active{transform:scale(.985)} button:disabled{opacity:.4}
button.primary{background:var(--brand);color:#fff}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{color:var(--bad);border-color:rgba(220,38,38,.4)}
button.big{width:100%;margin-top:10px;font-size:17px;min-height:52px}
button.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
button.done{background:var(--ok);color:#fff}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.row>div{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--text);appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
label.lab{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 0}
label.lab input,label.lab select{margin-top:5px}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:650;margin:12px 0}
label.sw input{width:auto;transform:scale(1.35);margin-right:4px}
.wt{font-size:24px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.adj{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:12px}
.adj input{text-align:center;font-size:18px;font-weight:700}
.adj .tag,.adj button.sm{grid-column:1/-1}
.sets{display:grid;gap:9px;margin:14px 0 4px}
.st{text-align:center}
.stn{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.st input{text-align:center;font-size:24px;font-weight:800;padding:12px 2px}
.st button{width:100%;margin-top:6px;min-height:42px;border-radius:11px}
.timer{margin:14px 0 6px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--chip)}
.tnum{text-align:center;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin-bottom:8px}
.tag{display:inline-block;font-style:normal;font-size:11px;font-weight:750;padding:3px 8px;border-radius:999px;
  background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.tag.warn2{color:var(--warn);border-color:rgba(180,83,9,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note{background:var(--chip);border:1px solid var(--line);border-left:4px solid var(--brand);
  border-radius:12px;padding:11px 13px;font-size:14px;margin-top:10px}
.note.warn{border-left-color:var(--warn)} .note.bad{border-left-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts .opt{text-align:left;font-size:15px;line-height:1.35}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;min-height:38px;padding:8px 14px;border-radius:999px;font-size:14px}
canvas{width:100%;height:auto;display:block;border-radius:12px}
details{margin-top:12px} summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--muted)}
details textarea{margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(15,23,42,.94);backdrop-filter:saturate(180%) blur(14px);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:rgba(255,255,255,.58);border-radius:10px;font-size:11px;font-weight:700;
  min-height:44px;padding:6px 2px;letter-spacing:.2px}
nav button.on{color:#fff;background:rgba(255,255,255,.14)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:40;max-width:88%;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:opacity .2s}
.toast.hide{opacity:0;pointer-events:none}
.hide{display:none!important}

</style>
</head>
<body>
<header>Four-Day Strength <span style="opacity:.55;font-weight:600">V3</span></header>
<main>
  <section id="home" class="pg"></section>
  <section id="work" class="pg hide"></section>
  <section id="dash" class="pg hide"></section>
  <section id="history" class="pg hide"></section>
  <section id="progress" class="pg hide"></section>
  <section id="settings" class="pg hide"></section>
</main>
<nav>
  <button data-p="home" class="on" onclick="go('home')">Today</button>
  <button data-p="dash" onclick="go('dash')">Dashboard</button>
  <button data-p="history" onclick="go('history')">History</button>
  <button data-p="progress" onclick="go('progress')">Progress</button>
  <button data-p="settings" onclick="go('settings')">Settings</button>
</nav>
<div id="toast" class="toast hide"></div>
<script>
/* Four-Day Strength V3 */
const V = 3;
const LADDER = [2.5, 2, 1, 0.5];
const LIFTS = ['Squat', 'Bench press', 'Press', 'Deadlift'];
const DEFS = [
  { name: 'Upper 1', type: 'upper', ex: [{ n: 'Bench press', sets: 3, reps: 5, role: 'first' }, { n: 'Press', sets: 3, reps: 5, role: 'second' }, { n: 'Chin-ups', sets: 3, reps: 0, role: 'acc' }] },
  { name: 'Lower 1', type: 'lower', ex: [{ n: 'Squat', sets: 3, reps: 5, role: 'first' }, { n: 'Deadlift', sets: 1, reps: 5, role: 'first' }] },
  { name: 'Upper 2', type: 'upper', ex: [{ n: 'Press', sets: 3, reps: 5, role: 'first' }, { n: 'Bench press', sets: 3, reps: 5, role: 'second' }, { n: 'Chin-ups', sets: 3, reps: 0, role: 'acc' }] },
  { name: 'Lower 2', type: 'lower', ex: [{ n: 'Squat', sets: 3, reps: 5, role: 'first' }, { n: 'Deadlift', sets: 1, reps: 5, role: 'first' }] }
];
const DEF = {
  v: V, next: 0,
  w: { 'Squat': 105, 'Press': 47.5, 'Bench press': 75, 'Deadlift': 135 },
  inc: { 'Squat': 2.5, 'Press': 2.5, 'Bench press': 2.5, 'Deadlift': 5 },
  secs: { 'Squat': 180, 'Press': 180, 'Bench press': 180, 'Chin-ups': 120, 'Deadlift': 0 },
  misses: { 'Squat': 0, 'Press': 0, 'Bench press': 0, 'Deadlift': 0 },
  resets: { 'Squat': 0, 'Press': 0, 'Bench press': 0, 'Deadlift': 0 },
  hist: [], bw: [], active: null, undo: null,
  set: { second90: false, sound: true, vibrate: true, wake: true, recovery: 48, target: 60, chinMode: 'bw', chinWeight: 5 }
};

let db = loadDb(), T = { n: 0, id: null, run: false }, AC = null, wake = null, chartLift = 'Squat', editIdx = -1;

function cl(x) { return JSON.parse(JSON.stringify(x)); }
function deep(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = deep(a[k] || {}, b[k]); else if (a[k] === undefined) a[k] = b[k]; } return a; }
function loadDb() { try { const s = JSON.parse(localStorage.getItem('ss4v3')); if (s) return deep(s, cl(DEF)); } catch (e) { } try { const o = JSON.parse(localStorage.getItem('ss4v2')); if (o) { const m = cl(DEF); if (o.w) m.w = Object.assign(m.w, o.w); if (o.inc) m.inc = Object.assign(m.inc, o.inc); if (o.hist) m.hist = o.hist; if (o.bw) m.bw = o.bw; if (typeof o.next === 'number') m.next = o.next; return m; } } catch (e) { } return cl(DEF); }
function save() { localStorage.setItem('ss4v3', JSON.stringify(db)); }
function r5(x) { return Math.round(x * 2) / 2; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function nextInc(cur) { for (let i = 0; i < LADDER.length; i++) if (LADDER[i] < cur - 0.001) return LADDER[i]; return 0.5; }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hide'), 2400); }
function fmt(d) { return new Date(d).toLocaleDateString([], { day: 'numeric', month: 'short' }); }
function fmtFull(d) { return new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }

/* ---------- audio + wake ---------- */
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
    s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch (e) { }
}
function beep() {
  if (!db.set.sound) return;
  try {
    if (!AC) return;
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    [0, 0.34, 0.68].forEach(off => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.3);
      o.start(t0 + off); o.stop(t0 + off + 0.32);
    });
  } catch (e) { }
}
async function getWake() { if (!db.set.wake) return; try { if ('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); } catch (e) { } }
function dropWake() { try { if (wake) { wake.release(); wake = null; } } catch (e) { } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && db.active) getWake(); });

/* ---------- routing ---------- */
function go(id) {
  document.querySelectorAll('.pg').forEach(x => x.classList.add('hide'));
  document.getElementById(id).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p === id));
  if (id === 'home') home(); if (id === 'dash') dash(); if (id === 'history') history_(); if (id === 'progress') progress(); if (id === 'settings') settings();
  window.scrollTo(0, 0);
}

/* ---------- prescription ---------- */
function presc(e) { if (e.n === 'Chin-ups') return null; let w = db.w[e.n]; if (db.set.second90 && e.role === 'second') w = r5(w * 0.9); return w; }
function lastOf(type) { return [...db.hist].reverse().find(h => h.type === type && h.status !== 'skipped'); }
function daysSinceAny() { const l = [...db.hist].reverse().find(h => h.status !== 'skipped'); return l ? (Date.now() - new Date(l.date)) / 864e5 : null; }
function chinWeightedNext() { let c = 0; db.hist.forEach(h => (h.ex || []).forEach(e => { if (e.n === 'Chin-ups') c++; })); return c % 2 === 0; }

/* ---------- home ---------- */
function home() {
  const s = DEFS[db.next], last = lastOf(s.type);
  const hrs = last ? (Date.now() - new Date(last.date)) / 36e5 : null;
  const warn = hrs !== null && hrs < db.set.recovery;
  const lay = daysSinceAny();
  const rows = s.ex.map(e => {
    if (e.n === 'Chin-ups') { const wt = db.set.chinMode === 'weighted' && chinWeightedNext(); return `<div class="lrow"><span>Chin-ups</span><b>${wt ? '+' + db.set.chinWeight + ' kg · 3×5' : '3 sets'}</b></div>`; }
    const w = presc(e), light = db.set.second90 && e.role === 'second';
    return `<div class="lrow"><span>${e.n}${light ? ' <em class="tag">light 90%</em>' : ''}</span><b>${w} kg · ${e.sets}×${e.reps}</b></div>`;
  }).join('');
  let flags = '';
  if (warn) flags += `<div class="note warn"><b>Recovery advisory</b><br>${Math.floor(hrs)} h since your last ${s.type} session (target ${db.set.recovery} h).</div>`;
  if (lay !== null && lay >= 7 && lay < 14) flags += `<div class="note warn"><b>Layoff</b><br>${Math.floor(lay)} days since you last trained. Repeat your last session set-for-set rather than adding weight.</div>`;
  if (lay !== null && lay >= 14) flags += `<div class="note warn"><b>Extended layoff</b><br>${Math.floor(lay)} days off. A 10% reset is recommended for lifters over 40.</div>`;
  LIFTS.forEach(n => { if (db.misses[n] >= 2) flags += `<div class="note bad"><b>${n} stalled</b><br>${db.misses[n]} consecutive missed sessions. The app will offer options at the end of your next ${n} session.</div>`; });
  document.getElementById('home').innerHTML = `
  <div class="card hero">
    <div class="kicker">NEXT SESSION</div><div class="h1">${s.name}</div>
    <div class="lifts">${rows}</div>
  </div>${flags}
  <div class="card">
    <label class="lab">Optional bodyweight (kg)</label>
    <input id="bw" inputmode="decimal" placeholder="${db.bw.length ? db.bw[db.bw.length - 1].value : '71.0'}">
    <button class="big primary" onclick="start()">Start workout</button>
    <div class="row2"><button class="ghost" onclick="toast('Session kept as your next workout')">Postpone</button><button class="ghost" onclick="skip()">Skip session</button></div>
  </div>
  ${db.active ? `<div class="card"><div class="note warn"><b>Workout in progress</b><br>${db.active.name}</div><button class="big primary" onclick="render()">Resume workout</button></div>` : ''}
  <div class="muted sm">Sound alerts require the iPhone silent switch to be off.</div>`;
}
function skip() {
  db.undo = cl(db);
  const s = DEFS[db.next];
  db.hist.push({ id: Date.now(), date: new Date().toISOString(), name: s.name, type: s.type, status: 'skipped', ex: [], conditioning: false, minutes: 0 });
  db.next = (db.next + 1) % 4; save(); home(); toast('Session skipped');
}

/* ---------- workout ---------- */
function start() {
  unlockAudio(); getWake();
  const b = parseFloat(document.getElementById('bw').value);
  if (b > 0) db.bw.push({ date: new Date().toISOString(), value: b });
  const s = DEFS[db.next];
  db.active = {
    id: Date.now(), name: s.name, type: s.type, idx: db.next, date: new Date().toISOString(), start: Date.now(), ei: 0,
    pain: s.type === 'upper' ? { shoulder: 'None', elbow: 'None' } : null,
    ex: s.ex.map(e => {
      const p = presc(e), wtd = e.n === 'Chin-ups' && db.set.chinMode === 'weighted' && chinWeightedNext();
      return { n: e.n, role: e.role, target: e.reps, presc: p, weight: p, light: !!(db.set.second90 && e.role === 'second'), weighted: wtd, addWeight: wtd ? db.set.chinWeight : 0, reps: Array(e.sets).fill(e.reps || 0), done: Array(e.sets).fill(false), note: '', tv: false };
    })
  };
  save(); render();
}
function render() {
  document.querySelectorAll('.pg').forEach(x => x.classList.add('hide'));
  document.getElementById('work').classList.remove('hide');
  const a = db.active; if (!a) return go('home');
  const e = a.ex[a.ei], mins = Math.round((Date.now() - a.start) / 60000);
  const reduced = e.presc != null && e.weight < e.presc - 0.001;
  const sets = e.reps.map((rp, i) => `<div class="st">
      <div class="stn">Set ${i + 1}</div>
      <input inputmode="numeric" value="${rp}" onchange="db.active.ex[${a.ei}].reps[${i}]=Math.max(0,parseInt(this.value)||0);save()">
      <button class="${e.done[i] ? 'done' : 'ghost'}" onclick="mark(${i})">${e.done[i] ? '✓' : 'Done'}</button></div>`).join('');
  document.getElementById('work').innerHTML = `
  <div class="card slim"><div class="row"><div><div class="kicker">${a.name}</div><div class="muted sm">${mins} min elapsed · lift ${a.ei + 1} of ${a.ex.length}</div></div>
  <button class="ghost sm" onclick="wrap()">End</button></div></div>
  ${a.pain ? `<div class="card slim"><div class="row2">
    <label class="lab">Shoulder<select onchange="db.active.pain.shoulder=this.value;save()">${po(a.pain.shoulder)}</select></label>
    <label class="lab">Elbow<select onchange="db.active.pain.elbow=this.value;save()">${po(a.pain.elbow)}</select></label></div></div>` : ''}
  <div class="card">
    <div class="row"><div class="h2">${e.n}${e.light ? ' <em class="tag">light</em>' : ''}</div>
    <div class="wt">${e.n === 'Chin-ups' ? (e.weighted ? '+' + e.addWeight + ' kg' : 'Bodyweight') : e.weight + ' kg'}</div></div>
    ${e.n !== 'Chin-ups' ? `<div class="adj">
      <button class="ghost" onclick="adjW(-2.5)">−2.5</button>
      <input inputmode="decimal" value="${e.weight}" onchange="setW(this.value)">
      <button class="ghost" onclick="adjW(2.5)">+2.5</button>
      ${reduced ? `<span class="tag warn2">reduced from ${e.presc}</span><button class="ghost sm" onclick="setW(${e.presc})">reset</button>` : ''}
    </div>` : ''}
    <div class="sets" style="grid-template-columns:repeat(${e.reps.length},1fr)">${sets}</div>
    ${e.tv ? `<div class="timer"><div class="tnum" id="tn">${clock(T.n)}</div>
      <div class="row3"><button class="ghost" onclick="adjT(-30)">−30s</button><button onclick="togT()">${T.run ? 'Pause' : 'Start'}</button><button class="ghost" onclick="adjT(30)">+30s</button></div></div>` : ''}
    <details><summary>Notes</summary><textarea rows="2" onchange="db.active.ex[${a.ei}].note=this.value;save()">${esc(e.note)}</textarea></details>
    <div class="row2"><button class="ghost" ${a.ei === 0 ? 'disabled' : ''} onclick="mv(-1)">Previous</button>
    <button class="primary" onclick="mv(1)">${a.ei === a.ex.length - 1 ? 'Finish workout' : 'Next lift'}</button></div>
  </div>`;
}
function po(v) { return ['None', 'Mild', 'Moderate', 'Severe'].map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join(''); }
function setW(v) { const e = db.active.ex[db.active.ei]; const n = parseFloat(v); if (n > 0) e.weight = r5(n); save(); render(); }
function adjW(d) { const e = db.active.ex[db.active.ei]; e.weight = Math.max(20, r5(e.weight + d)); save(); render(); }
function mark(i) {
  const a = db.active, e = a.ex[a.ei];
  e.done[i] = !e.done[i];
  if (e.done[i] && i < e.done.length - 1 && db.secs[e.n]) { e.tv = true; startT(db.secs[e.n]); }
  else if (!e.done.some(Boolean)) { e.tv = false; stopT(); }
  save(); render();
}
function mv(d) { const a = db.active; if (d > 0 && a.ei === a.ex.length - 1) return wrap(); a.ei = Math.max(0, Math.min(a.ex.length - 1, a.ei + d)); stopT(); save(); render(); }

/* ---------- timer ---------- */
function clock(n) { n = Math.max(0, n); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
function startT(n) { stopT(); unlockAudio(); getWake(); T = { n: n, run: true, id: setInterval(tick, 1000) }; }
function tick() { T.n--; const x = document.getElementById('tn'); if (x) x.textContent = clock(T.n); if (T.n <= 0) { stopT(); beep(); if (db.set.vibrate && navigator.vibrate) navigator.vibrate([300, 120, 300]); toast('Rest complete'); render(); } }
function stopT() { clearInterval(T.id); T = { n: T.n > 0 ? T.n : 0, run: false, id: null }; }
function togT() { if (T.run) { stopT(); render(); } else { startT(T.n || db.secs[db.active.ex[db.active.ei].n] || 180); render(); } }

/* ---------- wrap-up ---------- */
function wrap() {
  const a = db.active; if (!a) return go('home');
  stopT();
  a.wrapCond = a.wrapCond == null ? null : a.wrapCond;
  a.dec = a.dec || {};
  const blocks = a.ex.map((e, i) => {
    if (e.n === 'Chin-ups') return '';
    const reduced = e.presc != null && e.weight < e.presc - 0.001;
    const ok = e.done.every(Boolean) && e.reps.every(x => x >= e.target);
    if (reduced) return `<div class="card"><div class="h2">${e.n} · reduced to ${e.weight} kg</div>
      <p class="muted sm">Logged as a deliberate reduction. By default this is neither a success nor a miss, and ${e.presc} kg returns next session.</p>
      <div class="opts">${opt(i, 'neutral', 'Keep it neutral (recommended)', a.dec[i])}${opt(i, 'stick', 'Make ' + e.weight + ' kg my new working weight', a.dec[i])}</div></div>`;
    if (ok || e.light) return '';
    if (!e.done.some(Boolean)) return '';
    const m = db.misses[e.n] + 1, ni = nextInc(db.inc[e.n]), atFloor = db.inc[e.n] <= 0.5001;
    const rec = m >= 2 ? (atFloor ? 'reset' : 'smaller') : 'repeat';
    const hist3 = db.hist.slice(-12).filter(h => (h.ex || []).some(x => x.n === e.n)).slice(-3)
      .map(h => { const x = h.ex.find(y => y.n === e.n); return `${fmt(h.date)}: ${x.weight} kg ${x.reps.join('/')}`; }).join(' · ') || 'no prior sessions';
    return `<div class="card"><div class="h2">Missed lift · ${e.n}</div>
      <p class="muted sm">${e.weight} kg · ${e.reps.join('/')} · consecutive misses: ${m}<br>Recent: ${hist3}</p>
      <div class="opts">
        ${opt(i, 'repeat', 'Repeat ' + e.weight + ' kg next session' + (rec === 'repeat' ? ' (recommended)' : ''), a.dec[i])}
        ${atFloor ? '' : opt(i, 'smaller', 'Repeat and drop increment to ' + ni + ' kg' + (rec === 'smaller' ? ' (recommended)' : ''), a.dec[i])}
        ${opt(i, 'reset', '10% reset to ' + r5(e.weight * 0.9) + ' kg, increment ' + ni + ' kg' + (rec === 'reset' ? ' (recommended)' : ''), a.dec[i])}

  }).join('');
  document.querySelectorAll('.pg').forEach(x => x.classList.add('hide'));
  document.getElementById('work').classList.remove('hide');
  document.getElementById('work').innerHTML = `<div class="card hero"><div class="kicker">FINISH</div><div class="h1">${a.name}</div>
    <div class="muted sm">${Math.round((Date.now() - a.start) / 60000)} min</div></div>
  <div class="card"><div class="h2">Conditioning completed?</div>
    <div class="row2"><button class="${a.wrapCond === true ? 'primary' : 'ghost'}" onclick="db.active.wrapCond=true;save();wrap()">Yes</button>
    <button class="${a.wrapCond === false ? 'primary' : 'ghost'}" onclick="db.active.wrapCond=false;save();wrap()">No</button></div></div>
  ${blocks}
  <div class="card"><button class="big primary" onclick="commit()">Save workout</button>
  <button class="ghost" onclick="render()">Back to workout</button></div>`;
}
function opt(i, val, label, cur) { return `<button class="${cur === val ? 'primary' : 'ghost'} opt" onclick="db.active.dec[${i}]='${val}';save();wrap()">${label}</button>`; }
function commit() {
  const a = db.active;

  db.undo = cl(db);
  const rec = { id: a.id, date: a.date, name: a.name, type: a.type, idx: a.idx, pain: a.pain, conditioning: a.wrapCond, minutes: Math.round((Date.now() - a.start) / 60000), ex: [] };
  let pending = false;
  a.ex.forEach((e, i) => {
    const reduced = e.presc != null && e.weight < e.presc - 0.001;
    const ok = e.done.every(Boolean) && e.reps.every(x => x >= e.target);
    const entry = { n: e.n, weight: e.n === 'Chin-ups' ? null : e.weight, addWeight: e.addWeight || 0, presc: e.presc, reps: e.reps.slice(), done: e.done.slice(), target: e.target, note: e.note, light: e.light, reduced: reduced, success: e.n === 'Chin-ups' ? null : ok };
    if (e.n !== 'Chin-ups' && e.done.some(Boolean)) {
      if (reduced) {
        const d = a.dec[i] || 'neutral';
        entry.decision = d;

      } else if (ok) {

        entry.decision = d;
        db.misses[e.n]++;

        else if (d === 'reset') { db.w[e.n] = r5(e.weight * 0.9); db.inc[e.n] = nextInc(db.inc[e.n]); db.resets[e.n]++; db.misses[e.n] = 0; }

  rec.status = a.ex.every(e => e.done.every(Boolean)) ? 'completed' : 'partial';
  db.hist.push(rec); db.next = (a.idx + 1) % 4; db.active = null;
  stopT(); dropWake(); save(); go('home'); toast('Workout saved');
}

/* ---------- dashboard ---------- */
function weekAdd(n) {
  const cut = Date.now() - 7 * 864e5;

  return r5(rows[rows.length - 1].weight - rows[0].weight);
}
function condPct(days) {
  const cut = days ? Date.now() - days * 864e5 : 0;
  const done = db.hist.filter(h => h.status !== 'skipped' && new Date(h.date) >= cut);
  if (!done.length) return null;
  return Math.round(100 * done.filter(h => h.conditioning).length / done.length);
}

function saveEdit(i) {

  save();

  else toast('History updated');
  go('history');
}
function delSession(i) { if (!confirm('Delete this session permanently?')) return; db.undo = cl(db); db.hist.splice(i, 1); save(); recalcPrompt(); go('history'); }
function recalcPrompt() { if (confirm('Recalculate current working weights from the remaining history?')) recalc(); }
function recalc() {
  LIFTS.forEach(n => {
    const rows = db.hist.filter(h => h.status !== 'skipped').flatMap(h => (h.ex || []).filter(e => e.n === n && e.weight));
    if (!rows.length) return;
    const last = rows[rows.length - 1];
    if (last.reduced && last.decision !== 'stick') return;
    if (last.light) return;
    db.w[n] = last.success ? r5(last.weight + db.inc[n]) : last.weight;
    let m = 0;
    for (let k = rows.length - 1; k >= 0; k--) { if (rows[k].light || rows[k].reduced) continue; if (rows[k].success === false) m++; else break; }
    db.misses[n] = m;

}

/* ---------- progress graphs ---------- */
function series(n) {
  if (n === 'Bodyweight') return db.bw.map(x => ({ d: x.date, v: x.value }));
  if (n === 'Conditioning') { let t = 0, c = 0; return db.hist.filter(h => h.status !== 'skipped').map(h => { t++; if (h.conditioning) c++; return { d: h.date, v: Math.round(100 * c / t) }; }); }
  const out = [];
  db.hist.forEach(h => (h.ex || []).forEach(e => {
    if (e.n !== n) return;
    if (n === 'Chin-ups') out.push({ d: h.date, v: e.reps.reduce((a, b) => a + b, 0) });
    else if (e.weight) out.push({ d: h.date, v: e.weight, miss: e.success === false, light: e.light });
  }));
  return out;
}
function progress() {
  const names = ['Squat', 'Bench press', 'Press', 'Deadlift', 'Chin-ups', 'Bodyweight', 'Conditioning'];
  document.getElementById('progress').innerHTML = `<h2>Progress</h2>
  <div class="tabs">${names.map(n => `<button class="${n === chartLift ? 'primary' : 'ghost'}" onclick="chartLift='${n}';progress()">${n}</button>`).join('')}</div>
  <div class="card"><canvas id="cv" width="720" height="380"></canvas><div id="cstat" class="muted sm"></div></div>`;
  draw();
}
function draw() {
  const c = document.getElementById('cv'); if (!c) return;
  const x = c.getContext('2d'), d = series(chartLift), dark = matchMedia('(prefers-color-scheme:dark)').matches;
  const bg = dark ? '#161d2b' : '#ffffff', fg = dark ? '#f8fafc' : '#0f172a';
  x.clearRect(0, 0, c.width, c.height); x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
  const L = 56, R = 18, Tp = 34, B = 40, W = c.width - L - R, H = c.height - Tp - B;
  x.fillStyle = fg; x.font = '600 20px -apple-system,Segoe UI,sans-serif';
  x.fillText(chartLift + (chartLift === 'Chin-ups' ? ' — total reps' : chartLift === 'Bodyweight' ? ' — kg' : chartLift === 'Conditioning' ? ' — % completed' : ' — working weight (kg)'), L - 36, 22);
  if (!d.length) { x.font = '15px -apple-system,sans-serif'; x.fillStyle = dark ? '#94a3b8' : '#64748b'; x.fillText('No data yet', L, Tp + 40); document.getElementById('cstat').textContent = ''; return; }
  const vs = d.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo -= 2.5; hi += 2.5; } const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;

  for (let i = 0; i <= 4; i++) {
    const y = Tp + H - (i / 4) * H, v = lo + (i / 4) * (hi - lo);
    x.beginPath(); x.moveTo(L, y); x.lineTo(L + W, y); x.stroke();
    x.fillText((Math.round(v * 10) / 10).toString(), 6, y + 4);
  }
  const px = i => L + (d.length === 1 ? W / 2 : i * W / (d.length - 1));
  const py = v => Tp + H - (v - lo) / (hi - lo) * H;
  x.strokeStyle = '#2563eb'; x.lineWidth = 3; x.beginPath();
  d.forEach((p, i) => { i ? x.lineTo(px(i), py(p.v)) : x.moveTo(px(i), py(p.v)); }); x.stroke();
  d.forEach((p, i) => { x.beginPath(); x.arc(px(i), py(p.v), p.miss ? 5.5 : 4, 0, 7); x.fillStyle = p.miss ? '#dc2626' : (p.light ? '#94a3b8' : '#2563eb'); x.fill(); });
  x.fillStyle = dark ? '#94a3b8' : '#64748b'; x.font = '12px -apple-system,sans-serif';
  x.fillText(fmt(d[0].d), L - 10, c.height - 14);
  if (d.length > 1) x.fillText(fmt(d[d.length - 1].d), L + W - 30, c.height - 14);
  const first = d[0].v, last = d[d.length - 1].v, misses = d.filter(p => p.miss).length;
  document.getElementById('cstat').innerHTML = `${d.length} sessions · from ${first} to ${last} (${last - first >= 0 ? '+' : ''}${r5(last - first)})${misses ? ` · <span style="color:#dc2626">${misses} missed</span>` : ''}${chartLift === 'Squat' || chartLift === 'Press' || chartLift === 'Bench press' || chartLift === 'Deadlift' ? ' · red = missed, grey = light day' : ''}`;
}

function dl(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function expJSON() { dl('four-day-strength-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(db, null, 2), 'application/json'); }
function expCSV() {
  const rows = [['date', 'session', 'status', 'exercise', 'weight_kg', 'reps', 'success', 'decision', 'light', 'reduced', 'conditioning', 'minutes', 'shoulder', 'elbow', 'note']];
  db.hist.forEach(h => {
    if (!(h.ex || []).length) rows.push([h.date, h.name, h.status, '', '', '', '', '', '', '', h.conditioning, h.minutes || '', '', '', '']);
    else h.ex.forEach(e => rows.push([h.date, h.name, h.status, e.n, e.weight || '', e.reps.join('|'), e.success, e.decision || '', e.light || '', e.reduced || '', h.conditioning, h.minutes || '', h.pain ? h.pain.shoulder : '', h.pain ? h.pain.elbow : '', e.note || '']));
  });
  db.bw.forEach(b => rows.push([b.date, 'BODYWEIGHT', '', '', b.value, '', '', '', '', '', '', '', '', '', '']));
  dl('four-day-strength-' + new Date().toISOString().slice(0, 10) + '.csv', rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv');
}
function impJSON(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => {
    try {
      const x = JSON.parse(rd.result);
      if (!x || !x.w || !Array.isArray(x.hist)) throw new Error('bad');
      if (!confirm('Replace all current data with this backup? ' + x.hist.length + ' sessions found.')) return;
      db = deep(x, cl(DEF)); db.undo = null; save(); go('home'); toast('Backup restored');
    } catch (e) { alert('That file is not a valid backup.'); }
  };
  rd.readAsText(f);
}
function wipe() { if (!confirm('Delete all data and start again from the default weights?')) return; db = cl(DEF); save(); go('home'); toast('All data reset'); }

/* ---------- boot ---------- */
window.addEventListener('pagehide', save);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => { if (!document.getElementById('progress').classList.contains('hide')) draw(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
go('home');

</script>
