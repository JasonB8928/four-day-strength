<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Four-Day Strength V2</title><style>:root{color-scheme:light dark;--b:#2563eb;--c:#fff;--bg:#f3f4f6;--t:#111827;--bd:#d1d5db}@media(prefers-color-scheme:dark){:root{--c:#111827;--bg:#0b1220;--t:#f9fafb;--bd:#374151}}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}header{background:#111827;color:white;padding:18px;font-weight:800}.wrap{max-width:720px;margin:auto;padding:14px}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit;border-radius:10px;padding:12px;border:1px solid var(--bd)}button{background:var(--b);color:#fff;border:0;font-weight:700}.ghost{background:transparent;color:var(--t);border:1px solid var(--bd)}.big{font-size:1.45rem;font-weight:800}.muted{color:#6b7280}.row{display:flex;gap:8px}.row>*{flex:1}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sets input{width:100%;font-size:1.4rem;text-align:center}.done{background:#15803d}.timer{text-align:center;font-size:2.7rem;font-weight:900}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#111827;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}nav button{background:transparent;font-size:.8rem}canvas{width:100%;background:var(--c);border-radius:12px}textarea{width:100%}</style></head><body><header>Four-Day Strength V2</header><div class="wrap"><section id="home"></section><section id="work" class="hidden"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"><h2>Progress</h2><canvas id="chart" width="680" height="340"></canvas></section><section id="settings" class="hidden"></section></div><nav><button onclick="page('home')">Home</button><button onclick="page('history')">History</button><button onclick="page('progress')">Progress</button><button onclick="page('settings')">Settings</button></nav><script>
const defs=[['Upper 1','upper',[['Bench press',3,5],['Press',3,5],['Chin-ups',3,0]]],['Lower 1','lower',[['Squat',3,5],['Deadlift',1,5]]],['Upper 2','upper',[['Press',3,5],['Bench press',3,5],['Chin-ups',3,0]]],['Lower 2','lower',[['Squat',3,5],['Deadlift',1,5]]]];
const dflt={next:0,w:{'Squat':105,'Press':47.5,'Bench press':75,'Deadlift':135},inc:{'Squat':2.5,'Press':2.5,'Bench press':2.5,'Deadlift':5},secs:{'Squat':180,'Press':180,'Bench press':180,'Chin-ups':120,'Deadlift':0},hist:[],bw:[],active:null};let db=JSON.parse(localStorage.getItem('ss4v2')||'null')||dflt,t={n:0,id:null,run:false};const save=()=>localStorage.setItem('ss4v2',JSON.stringify(db));function page(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='home')home();if(id==='history')hist();if(id==='progress')graph();if(id==='settings')settings()}
function home(){let s=defs[db.next],ex=s[2].map(x=>`${x[0]} ${x[0]=='Chin-ups'?'3 sets':db.w[x[0]]+' kg · '+x[1]+'×'+x[2]}`).join('<br>');document.getElementById('home').innerHTML=`<div class=card><div class=muted>NEXT SESSION</div><div class=big>${s[0]}</div><p>${ex}</p><label>Optional bodyweight (kg)</label><input id=bw inputmode=decimal placeholder=71.0><p><button onclick=start()>Start workout</button></p></div>${db.active?'<div class=card><button onclick=render()>Resume workout</button></div>':''}`}
function start(){let b=+document.getElementById('bw').value;if(b)db.bw.push({date:new Date().toISOString(),value:b});let s=defs[db.next];db.active={name:s[0],type:s[1],idx:db.next,start:Date.now(),ei:0,pain:{shoulder:'None',elbow:'None'},ex:s[2].map(x=>({name:x[0],weight:x[0]=='Chin-ups'?null:db.w[x[0]],target:x[2],reps:Array(x[1]).fill(x[2]||0),done:Array(x[1]).fill(false),note:'',timerVisible:false}))};save();render()}
function render(){pageRaw('work');let a=db.active,e=a.ex[a.ei];document.getElementById('work').innerHTML=`<div class=card><div class=muted>ACTIVE WORKOUT</div><div class=big>${a.name}</div>${a.type==='upper'?`<div class=row><label>Shoulder<select onchange="db.active.pain.shoulder=this.value;save()">${opts(a.pain.shoulder)}</select></label><label>Elbow<select onchange="db.active.pain.elbow=this.value;save()">${opts(a.pain.elbow)}</select></label></div>`:''}</div><div class=card><div class=muted>${a.ei+1} of ${a.ex.length}</div><div class=row><div class=big>${e.name}</div><div class=big style=text-align:right>${e.weight?e.weight+' kg':'Bodyweight'}</div></div><div class=sets style="grid-template-columns:repeat(${e.reps.length},1fr)">${e.reps.map((r,i)=>`<div><label>Set ${i+1}</label><input value=${r} inputmode=numeric onchange="db.active.ex[${a.ei}].reps[${i}]=+this.value;save()"><button class="${e.done[i]?'done':'ghost'}" onclick="setDone(${i})">${e.done[i]?'✓ Done':'Complete'}</button></div>`).join('')}</div>${e.timerVisible?`<div class=timer id=tm>${clock(t.n||db.secs[e.name])}</div><div class=row><button class=ghost onclick="adj(-30)">−30s</button><button onclick=toggleTimer()>${t.run?'Pause':'Start'}</button><button class=ghost onclick="adj(30)">+30s</button></div>`:''}<details><summary>Exercise notes</summary><textarea onchange="db.active.ex[${a.ei}].note=this.value;save()">${e.note}</textarea></details><div class=row style=margin-top:14px><button class=ghost onclick="move(-1)" ${a.ei==0?'disabled':''}>Previous</button><button onclick="move(1)">${a.ei==a.ex.length-1?'Finish':'Next exercise'}</button></div></div><div class=row><button class=ghost onclick="page('home')">Resume later</button><button onclick=finish()>End workout</button></div>`}
function pageRaw(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function opts(v){return ['None','Mild','Moderate','Severe'].map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}
function setDone(i){let e=db.active.ex[db.active.ei];e.done[i]=!e.done[i];if(e.done[i]&&i<e.done.length-1&&db.secs[e.name]){e.timerVisible=true;startTimer(db.secs[e.name])}if(!e.done.some(Boolean)){e.timerVisible=false;stopTimer()}save();render()}function move(n){let a=db.active;if(n>0&&a.ei==a.ex.length-1){finish();return}a.ei=Math.max(0,Math.min(a.ex.length-1,a.ei+n));stopTimer();save();render()}function startTimer(n){stopTimer();t={n,id:setInterval(()=>{t.n--;let x=document.getElementById('tm');if(x)x.textContent=clock(t.n);if(t.n<=0){stopTimer();if(navigator.vibrate)navigator.vibrate([250,100,250]);beep()}},1000),run:true}}function stopTimer(){clearInterval(t.id);t={n:0,id:null,run:false}}function toggleTimer(){if(t.run){clearInterval(t.id);t.run=false;render()}else startTimer(t.n||db.secs[db.active.ex[db.active.ei].name])}function adj(n){t.n=Math.max(0,(t.n||db.secs[db.active.ex[db.active.ei].name])+n);render()}function clock(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function beep(){try{let c=new AudioContext,o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.4)}catch(e){}}
function finish(){let a=db.active;if(!a)return;let conditioning=confirm('Conditioning completed? OK = Yes, Cancel = No');a.date=new Date().toISOString();a.minutes=Math.round((Date.now()-a.start)/60000);a.conditioning=conditioning;a.ex.forEach(e=>{if(e.name!='Chin-ups'){e.success=e.done.every(Boolean)&&e.reps.every(r=>r>=e.target);if(e.success)db.w[e.name]=e.weight+db.inc[e.name]}});db.hist.push(a);db.next=(a.idx+1)%4;db.active=null;stopTimer();save();page('home')}
function hist(){document.getElementById('history').innerHTML='<h2>History</h2>'+(db.hist.length?[...db.hist].reverse().map(w=>`<div class=card><b>${w.name}</b><div class=muted>${new Date(w.date).toLocaleString()} · ${w.minutes} min · Conditioning ${w.conditioning?'Yes':'No'}</div>${w.ex.map(e=>`<div>${e.name}: ${e.weight?e.weight+' kg':'BW'} · ${e.reps.join('/')}</div>`).join('')}</div>`).join(''):'<div class=card>No workouts yet.</div>')}
function graph(){let c=document.getElementById('chart'),x=c.getContext('2d'),v=[];db.hist.forEach(w=>w.ex.forEach(e=>{if(e.name==='Squat')v.push(e.weight)}));x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111827';x.font='22px sans-serif';x.fillText('Squat working weight',20,30);if(!v.length){x.fillText('No data yet',20,70);return}let lo=Math.min(...v)-2.5,hi=Math.max(...v)+2.5;x.strokeStyle='#2563eb';x.lineWidth=4;x.beginPath();v.forEach((y,i)=>{let px=30+i*(c.width-60)/Math.max(1,v.length-1),py=310-(y-lo)/(hi-lo)*240;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function settings(){document.getElementById('settings').innerHTML=`<h2>Settings</h2><div class=card><b>Progression increments</b>${Object.keys(db.inc).map(k=>`<label>${k}</label><input type=number step=.25 value=${db.inc[k]} onchange="db.inc['${k}']=+this.value;save()">`).join('')}</div><div class=card><button onclick=backup()>Export JSON backup</button> <button class=ghost onclick=csv()>Export CSV</button></div>`}function backup(){dl('strength-v2-backup.json',JSON.stringify(db,null,2),'application/json')}function csv(){let r=[['date','session','exercise','weight','reps','conditioning']];db.hist.forEach(w=>w.ex.forEach(e=>r.push([w.date,w.name,e.name,e.weight||'',e.reps.join('|'),w.conditioning])));dl('strength-v2.csv',r.map(a=>a.join(',')).join('\n'),'text/csv')}function dl(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');page('home');
</script></body></html>
